name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig version
        run: zig version
      - name: build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
      - name: unit tests
        run: zig build test
      - name: smoke test (flow + pixel round trip)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python3 - <<'PY'
          import zipfile, textwrap
          html = "<html><body>" + "".join(f"<p>第{i}段 天地玄黄 宇宙洪荒</p>" for i in range(200)) + "</body></html>"
          opf = """<?xml version="1.0"?>
          <package xmlns="http://www.idpf.org/2007/opf" version="3.0">
            <manifest><item id="c1" href="ch1.xhtml" media-type="application/xhtml+xml"/></manifest>
            <spine><itemref idref="c1"/></spine>
          </package>"""
          container = """<?xml version="1.0"?>
          <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
            <rootfiles><rootfile full-path="content.opf" media-type="application/oebps-package+xml"/></rootfiles>
          </container>"""
          with zipfile.ZipFile("tmp/book.epub", "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("mimetype", "application/epub+zip")
              z.writestr("META-INF/container.xml", container)
              z.writestr("content.opf", textwrap.dedent(opf))
              z.writestr("ch1.xhtml", html)
          PY
          BIN=zig-out/bin/book2png
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" flow tmp/book.epub tmp/flow.png --width 800 --size 12 --bilevel
          "$BIN" pixel tmp/book.epub tmp/pixel.png
          "$BIN" decode tmp/pixel.png tmp/restored.epub
          cmp tmp/book.epub tmp/restored.epub
          ls -l tmp

  cross:
    name: cross-compile check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-gnu, x86_64-windows-gnu, aarch64-macos]
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
