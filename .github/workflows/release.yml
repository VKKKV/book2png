name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build all platforms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            target: aarch64-linux-gnu
            archive: tar.gz
          - name: macos-x86_64
            target: x86_64-macos
            archive: tar.gz
          - name: macos-aarch64
            target: aarch64-macos
            archive: tar.gz
          - name: windows-x86_64
            target: x86_64-windows-gnu
            archive: zip
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} --prefix dist

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name=book2png-${{ github.ref_name }}-${{ matrix.name }}
          mkdir -p pkg
          cp LICENSE README.md pkg/
          if [ -f dist/bin/book2png.exe ]; then
            cp dist/bin/book2png.exe pkg/
          else
            cp dist/bin/book2png pkg/
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd pkg && zip -q -r "../$name.zip" .)
          else
            tar -czf "$name.tar.gz" -C pkg .
          fi
          ls -l

      - name: verify binary
        shell: bash
        run: |
          set -euo pipefail
          file dist/bin/book2png* || true
          if [ -x dist/bin/book2png ] && [ "$(uname -m)" = "x86_64" ] && [ "${{ matrix.target }}" = "x86_64-linux-gnu" ]; then
            dist/bin/book2png --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            book2png-*.tar.gz
            book2png-*.zip

  publish:
    name: publish release assets
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
